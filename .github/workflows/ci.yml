# Format, lint and test on the three target systems, and type-check the UI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v5

      # WebKitGTK and friends: the Tauri crate does not compile on Linux without them.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Formatting and the UI cannot differ between systems: checked once.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - uses: actions/setup-node@v5
        if: runner.os == 'Linux'
        with:
          node-version: 24
          cache: npm

      - name: UI type-check and build
        if: runner.os == 'Linux'
        run: |
          npm ci
          npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
